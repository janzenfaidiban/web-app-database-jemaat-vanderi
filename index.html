<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SI JEMAAT</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root { 
            --primary-green: #198754; 
            --light-bg: #f8f9fa; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--light-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            background: white;
        }

        .shadow-md { 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important; 
        }

        .btn-success {
            background-color: var(--primary-green);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-success:hover {
            background-color: #157347;
            transform: translateY(-2px);
        }

        .form-control {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.1);
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: #f0fdf4;
            color: var(--primary-green);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="card login-card shadow-md mx-auto">
            <div class="card-body p-4 p-md-5">
                <div class="text-center">
                    <div class="brand-logo shadow-sm">
                        <i class="bi bi-church-fill fs-1"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-1">SI JEMAAT</h4>
                    <p class="text-muted small mb-4">Silakan masuk ke akun admin Anda</p>
                </div>

                <form action="dasbor.html">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username atau Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 ps-0" placeholder="Masukkan username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Kata Sandi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-0" placeholder="Masukkan kata sandi">
                        </div>
                        <div class="text-end mt-2">
                            <a href="#" class="text-success text-decoration-none small">Lupa sandi?</a>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-box-arrow-in-right"></i> Masuk Sekarang
                        </button>
                    </div>
                </form>

                <div class="mt-5 text-center">
                    <p class="small text-muted mb-0">Designed by</p>
                    <a href="https://vanderiyarangga.github.io" target="_blank" class="text-success fw-bold text-decoration-none small">Vanderi Yarangga</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
